name: Daily prices

on:
  schedule:
    - cron: "43 21 * * 1-5"   # ~5:43pm ET weekdays, after the close
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-prices
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas requests
      - run: python scan/fetch_prices.py
      - name: Commit and push
        run: |
          git config user.name "sim-desk-bot"
          git config user.email "bot@sim-desk"
          git add docs/data/prices.json
          git diff --cached --quiet && echo "No changes" || \
            git commit -m "chore: daily prices $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push

      # Drives the real page script against the file we just published, so a
      # payload the front end cannot read (a missing `stale` map, a renamed
      # key) fails here rather than in an intern's browser. After the push for
      # the same reason as the gate below.
      - name: Front-end contract
        run: node tests/check.mjs

      # Runs AFTER the push on purpose. Carrying a missing close forward makes
      # the file safe to publish no matter how bad the fetch was, so withholding
      # it would only hurt. What must not happen is a bad fetch passing quietly:
      # the count of tickers in this file WAS the signal that the universe
      # refresh had broken the download, and nothing was reading it.
      - name: Coverage gate
        run: |
          python - <<'PY'
          import json, sys, pathlib
          c = json.loads(pathlib.Path("docs/data/prices.json").read_text())["coverage"]
          print(f"universe {c['universe']} · fresh {c['fresh']} "
                f"({c['fresh_pct']:.1%}) · carried forward {c['stale']}")
          bad = []
          if c["fresh_pct"] < c["floor"]:
              bad.append(f"fresh coverage {c['fresh_pct']:.1%} < floor {c['floor']:.0%}")
          if not c["spy_fresh"]:
              bad.append("SPY has no fresh close — the benchmark leg of every "
                         "intern's vs-SPY number is stale")
          if bad:
              print("::error::" + "; ".join(bad))
              sys.exit(1)
          PY
