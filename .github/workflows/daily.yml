name: Daily prices

on:
  schedule:
    - cron: "43 21 * * 1-5"   # ~5:43pm ET weekdays, after the close
    # GitHub starts the evening run 3-4 hours late (00:00-01:46 UTC since
    # 10-20), and in that window Yahoo hands back the PRIOR day's bar for
    # ~99% of tickers: 10-20..11-07 failed at 0.7% fresh, while the same code
    # dispatched 11-09 15:53 ET priced 99.3%. A morning run before the open
    # captures the close for sure; the file only ever improves, so two runs
    # a day are harmless.
    - cron: "7 10 * * 2-6"    # ~5-6am ET, Tue-Sat, the previous session
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-prices
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas requests pytest
      - run: python scan/fetch_prices.py
      - name: Commit and push
        run: |
          git config user.name "sim-desk-bot"
          git config user.email "bot@sim-desk"
          git add docs/data/prices.json
          git diff --cached --quiet && echo "No changes" || \
            git commit -m "chore: daily prices $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push

      # Both suites run AFTER the push, for the same reason as the gate below:
      # carrying a missing close forward makes the file safe to publish however
      # badly the fetch went, so a red test should surface the problem, not
      # withhold the day's prices.
      #
      # check.mjs drives the real page script against the file we just
      # published, so a payload the front end cannot read (a missing `stale`
      # map, a renamed key) fails here rather than in an intern's browser.
      - name: Tests
        run: |
          python -m pytest tests/test_fetch_prices.py -q
          node tests/check.mjs

      # Runs AFTER the push on purpose. Carrying a missing close forward makes
      # the file safe to publish no matter how bad the fetch was, so withholding
      # it would only hurt. What must not happen is a bad fetch passing quietly:
      # the count of tickers in this file WAS the signal that the universe
      # refresh had broken the download, and nothing was reading it.
      - name: Coverage gate
        run: |
          python - <<'PY'
          import json, sys, pathlib
          c = json.loads(pathlib.Path("docs/data/prices.json").read_text())["coverage"]
          # ASCII only: this gate is the thing that has to work when
          # everything else did not, so it does not depend on the runner's
          # stdout encoding.
          print(f"universe {c['universe']} | fresh {c['fresh']} "
                f"({c['fresh_pct']:.1%}) | carried forward {c['stale']}")
          bad = []
          if c["fresh_pct"] < c["floor"]:
              bad.append(f"fresh coverage {c['fresh_pct']:.1%} < floor {c['floor']:.0%}")
          if not c["spy_fresh"]:
              bad.append("SPY has no fresh close - the benchmark leg of every "
                         "intern's vs-SPY number is stale")
          if bad:
              print("::error::" + "; ".join(bad))
              sys.exit(1)
          PY
